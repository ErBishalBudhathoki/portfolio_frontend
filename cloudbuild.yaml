steps:
  # Build the container image
  # NEXT_PUBLIC_* values are inlined at build time, so the API URL must be
  # passed as a build arg (a runtime --set-env-vars cannot affect the bundle).
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/portfolio-frontend'
      - '-f'
      - 'frontend/Dockerfile'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_API_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_GITHUB_URL=${_GITHUB_URL}'
      - './frontend'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/portfolio-frontend']

# Set a longer timeout for the build
timeout: '3600s'

# Specify the images to be pushed to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/portfolio-frontend'

substitutions:
  # Overridden by deploy.sh with the live backend URL.
  _API_URL: 'https://portfolio-backend-824962762241.us-central1.run.app'
  _GITHUB_URL: 'https://github.com/ErBishalBudhathoki'